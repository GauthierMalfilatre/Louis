name: Feature
description: A new widget, service, or capability
title: "[Feature] "
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Tick-able statements a reviewer can check against the PR.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: scope
    # attributes:
    #   label: Where
    #   options: [backend, frontend, docker, ci]
    validations:
      required: true
