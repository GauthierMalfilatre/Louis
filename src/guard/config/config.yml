# Rails of Louis, read by NeMo Guardrails (with every .yml, .co and actions.py of this folder).
# The rules are the flows listed under rails.input and rails.output: remove a line to turn a rule off.
# Masking flows anonymize the message, the others refuse it. They run in the order below.
colang_version: "1.0"

models:
  # The judge of the self checks: the same model as the chat, so Ollama keeps one model loaded.
  # NeMo calls the OpenAI API of Ollama (/v1), which cannot set num_ctx nor keep_alive (options are ignored there,
  # measured on Ollama 0.34): Ollama uses its own defaults (4096 tokens, 5 minutes), and reloads the model when they
  # differ from Louis' (chat.context, chat.keepalive). Each check then reloads it twice, for NeMo and for the next
  # request of the chat or of the judge: 12 to 18 s each with qwen3.5:9b on a laptop. Start Ollama with the values
  # of chat.context and chat.keepalive (Louis tells it after its first check when they differ):
  #   OLLAMA_CONTEXT_LENGTH=24576 OLLAMA_KEEP_ALIVE=30m ollama serve
  # or, for the service:  sudo systemctl edit ollama  ->  [Service] Environment="OLLAMA_CONTEXT_LENGTH=24576" ...
  - type: main
    engine: ollama
    model: qwen3.5:9b
    parameters:
      base_url: http://localhost:11434/v1
      # A judge answers Yes or No at once: thinking first, qwen3 takes ~30s per check instead of ~4s
      reasoning_effort: none

rails:
  config:
    # Presidio. The pattern-based entities work in any language. PERSON is left out: its English spaCy
    # model reads French poorly, and on a code assistant it masks names of classes and authors
    sensitive_data_detection:
      input:
        entities: [EMAIL_ADDRESS, CREDIT_CARD, IBAN_CODE]
      output:
        entities: [EMAIL_ADDRESS, CREDIT_CARD, IBAN_CODE]

  input:
    flows:
      # Anonymize before the model reads it: cheap, deterministic, first
      - mask french ids on input
      - mask sensitive data on input
      # Refuse: the model judges the message against the policy of prompts.yml (one more model call)
      - self check input

  output:
    flows:
      # Refuse: a key or a token read by cat_file must never be shown back
      - block secrets on output
      - mask french ids on output
      - mask sensitive data on output
      - self check output

  # The calls the model asks for, before the tool runs ("output" of the model, in the words of NeMo)
  tool_output:
    flows:
      # Refuse: a secret or a personal data in the arguments of a tool that sends them out of the machine
      - block sensitive data in tool calls

  # The results of the tools listed in custom_data.guard.untrusted_tools, before the model reads them
  tool_input:
    flows:
      # Take out the passages that give orders to the model (prompt injection through the knowledge base)
      - drop injected passages in tool results
      # Anonymize: a secret or a personal data the indexed folder held
      - mask sensitive data in tool results

# Read by the actions of actions.py, and by the Guard
custom_data:
  guard:
    # The tools that read what nobody in the project wrote: their results are screened. The file tools stay out:
    # masking the file the model is about to edit_file would make its old_string never match
    untrusted_tools: [search_knowledge]
    # The tools whose arguments leave the machine: the query of web_search goes to a search engine.
    # The file tools stay out: they write in the user's project, and ask the user first (with the diff)
    outbound_tools: [web_search]
