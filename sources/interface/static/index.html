  /* UltraVision: a theme with no chill whatsoever */
  :root[data-theme="ultravision"] {
    color-scheme: dark;

    --sidebar: #0a0420;
    --surface: #0e0526;

  /* A drifting rainbow nebula, confined to the empty chat backdrop: panels with their own
     opaque background (header, sidebar, bubbles, composer) sit on top and are unaffected */
  :root[data-theme="ultravision"] body {
    background-image:
      radial-gradient(circle at 12% 18%, rgb(255 47 208 / 0.4), transparent 42%),
      radial-gradient(circle at 88% 12%, rgb(0 246 255 / 0.35), transparent 42%),
      radial-gradient(circle at 50% 92%, rgb(255 225 77 / 0.3), transparent 46%),
      radial-gradient(circle at 92% 85%, rgb(57 255 157 / 0.3), transparent 42%);
    background-size: 200% 200%;
    animation: uv-drift 16s ease-in-out infinite alternate;
  }
  :root[data-theme="ultravision"] .mark { stroke-width: 1.1; }
  :root[data-theme="ultravision"] .logo-start { animation: uv-hue 5s linear infinite; }
  :root[data-theme="ultravision"] .logo-end { animation: uv-hue 5s linear infinite -2.5s; }
  :root[data-theme="ultravision"] .prompt.busy::before,
  :root[data-theme="ultravision"] .prompt.busy::after { animation-duration: 0.9s; }
  :root[data-theme="ultravision"] .greeting .name {
    /* background-image, not the "background" shorthand: the shorthand resets
       background-clip to border-box, which would undo the base rule's text-clip */
    background-image: linear-gradient(90deg, #ff2fd0, #00f6ff, #ffe14d, #39ff9d, #ff2fd0);
    background-size: 300% 100%;
    animation: uv-sweep 4s linear infinite;
  }
  @keyframes uv-drift {
    from { background-position: 0% 0%, 100% 0%, 50% 100%, 100% 100%; }
    to   { background-position: 30% 40%, 65% 30%, 40% 65%, 70% 55%; }
  }
  @keyframes uv-hue {
    0%   { stop-color: #ff2fd0; }
    25%  { stop-color: #00f6ff; }
    50%  { stop-color: #ffe14d; }
    75%  { stop-color: #39ff9d; }
    100% { stop-color: #ff2fd0; }
  }
  @keyframes uv-sweep { to { background-position: 300% 0; } }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    background: var(--bg);
    background-image: radial-gradient(70% 50% at 50% 0%, var(--glow), transparent 70%);
    color: var(--text);
    font: 15px/1.65 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .sprite { position: absolute; width: 0; height: 0; }
  .logo-start { stop-color: var(--logo-1); }
  .logo-end { stop-color: var(--logo-2); }
  .mark {
    display: block;
    width: 28px;
    height: 28px;
    flex: none;
    /* A script letter is hairline thin: stroking it keeps it readable when small */
    stroke: url(#louis-gradient);
    stroke-width: 0.7;
  }
  /* Scrollbars that belong to the theme */
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { border: 3px solid transparent; border-radius: 999px; background: var(--border) padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted) padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  code, pre, kbd { font-family: var(--mono); }
  kbd {
    display: inline-block;
    min-width: 1.6em;
    padding: 0 5px;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--surface);
    font-size: 0.85em;
    line-height: 1.5;
    text-align: center;
  }

  /* Layout */
  .app { display: flex; flex: 1; min-height: 0; }
  .col { display: flex; flex-direction: column; flex: 1; min-width: 0; }

  /* Sessions */
  .sidebar {
    display: flex;
    flex-direction: column;
    flex: none;
    width: 268px;
    overflow: hidden;
    border-right: 1px solid var(--border-soft);
    background: var(--sidebar);
    transition: width 0.22s ease;
  }
  .sidebar > * { min-width: 268px; }  /* Keeps the content still while it folds */
  @media (min-width: 861px) {
    .app.collapsed .sidebar {
      width: 0;
      border-right-color: transparent;
      visibility: hidden;
      transition: width 0.22s ease, visibility 0s linear 0.22s;
    }
    .app.collapsed .burger { display: grid; }
  }
  .side-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px; }
  .side-head .new-session { flex: 1; min-width: 0; }
  .new-session {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    font-weight: 550;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .new-session:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .new-session:disabled { opacity: 0.5; cursor: default; }
  .new-session:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .group-title {
    padding: 12px 10px 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .group-title:first-child { padding-top: 4px; }
  .sessions { flex: 1; overflow-y: auto; padding: 2px 8px 12px; }
  .session {
    display: block;
    width: 100%;
    padding: 7px 10px;
    border: 0;
    border-radius: 10px;
    background: none;
    text-align: left;
    cursor: pointer;
  }
  .session:hover:not(:disabled) { background: var(--surface-2); }
  .session:disabled { cursor: default; }
  .session[aria-current="true"] { background: var(--accent-soft); }
  .session:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .session .title { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; }
  .session[aria-current="true"] .title { color: var(--accent); font-weight: 550; }
  .session .meta { display: block; color: var(--muted); font-size: 11.5px; }
  .side-note { padding: 6px 16px; color: var(--muted); font-size: 12.5px; }
  .side-foot {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    font-size: 13.5px;
  }
  .avatar {
    display: grid;
    place-items: center;
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 12px;
    font-weight: 650;
  }
  .side-foot .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .backdrop { position: fixed; inset: 0; z-index: 20; background: rgb(15 8 30 / 0.45); }
  .backdrop[hidden] { display: none; }
  .burger {
    display: none;
    place-items: center;
    flex: none;
    width: 34px;
    height: 34px;
    margin-right: -4px;
    border: 0;
    border-radius: 9px;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .burger:hover { background: var(--surface-2); color: var(--text); }

  /* New session dialog */
  dialog {
    width: min(520px, calc(100vw - 32px));
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-lg);
  }
  dialog::backdrop { background: rgb(15 8 30 / 0.45); }
  .dialog-body { padding: 18px 20px 16px; }
  .dialog-body h2 { margin: 0 0 6px; font-size: 17px; }
  .dialog-body p { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }
  #system-prompt {
    display: block;
    width: 100%;
    min-height: 104px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: inherit;
    font: inherit;
    resize: vertical;
  }
  #system-prompt:focus { outline: none; border-color: var(--accent); }
  .dialog-foot {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
  }
  .btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { border-color: transparent; background: var(--accent); color: var(--accent-text); font-weight: 550; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand svg { display: block; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-name { font-size: 15.5px; font-weight: 680; letter-spacing: -0.01em; }
  .brand-sub { color: var(--muted); font-size: 10px; font-weight: 550; letter-spacing: 0.09em; text-transform: uppercase; }
  .bar-end { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .icon-btn {
    display: grid;
    place-items: center;
    flex: none;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 9px;
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #theme svg { display: none; }       /* It holds the three theme icons, one is shown */
  #theme svg.on { display: block; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  .status[data-state="ready"] .dot { background: var(--ok); }
  .status[data-state="busy"] .dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .status[data-state="reconnecting"] .dot { background: var(--warn); }
  .model-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    max-width: 220px;
    padding: 4px 8px 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg);
    font-family: var(--mono);
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .model-chip:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .model-chip:disabled { cursor: default; opacity: 0.6; }
  .model-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .model-chip[hidden] { display: none; }
  .model-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model-chip svg { flex: none; color: var(--muted); }

  /* Conversation */
  main { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .log {
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 780px;
    min-height: 100%;
    margin: 0 auto;
    padding: 24px 16px 32px;
  }

  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin: auto 0;
    padding: 24px 0 8vh;
    text-align: center;
    animation: rise 0.5s ease-out both;
  }
  .greeting {
    margin: 0;
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
  }
  .greeting .name {
    background: linear-gradient(100deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .empty .mark { width: 64px; height: 64px; margin-bottom: 14px; stroke-width: 0.3; filter: drop-shadow(0 8px 20px var(--glow)); }
  .empty .lead { margin: 0 0 20px; color: var(--muted); font-size: 16px; }
  .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 560px; }
  .suggestion {
    padding: 9px 15px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--shadow);
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.15s, color 0.15s;
  }
  .suggestion:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .suggestion:disabled { cursor: default; opacity: 0.6; }
  .suggestion:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tip { margin: 18px 0 0; color: var(--muted); font-size: 13px; }

  .msg { max-width: 100%; overflow-wrap: anywhere; animation: rise 0.22s ease-out; }
  .msg.user {
    align-self: flex-end;
    max-width: min(80%, 620px);
    padding: 9px 14px;
    border-radius: 18px 18px 4px 18px;
    background: var(--user-bg);
    color: var(--user-text);
    white-space: pre-wrap;
  }
  .msg.user.command { font-family: var(--mono); font-size: 14px; }
  .msg.assistant {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: 12px;
    align-self: stretch;
    align-items: start;
  }
  .msg.assistant .mark { width: 28px; height: 28px; margin-top: 1px; }
  .msg.assistant.plain .body { white-space: pre-wrap; }
  .msg.assistant[hidden] { display: none; }

  .tools { margin: 0 0 12px; }
  .tools summary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px 3px 9px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: 12.5px;
    list-style: none;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .tools summary::-webkit-details-marker { display: none; }
  .tools summary:hover { border-color: var(--accent); color: var(--accent); }
  .tools summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tools .chev { transition: transform 0.15s; }
  .tools[open] .chev { transform: rotate(180deg); }
  .tools-list {
    display: grid;
    gap: 5px;
    width: fit-content;
    max-width: 100%;
    margin-top: 7px;
    padding: 9px 12px;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    background: var(--surface);
  }
  .tool { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 12.5px; }
  .tool .name { flex: none; font-family: var(--mono); color: var(--accent); }
  .tool .detail {
    overflow: hidden;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11.5px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .msg.assistant .body > :first-child { margin-top: 0; }
  .msg.assistant .body > :last-child { margin-bottom: 0; }
  .msg.assistant p, .msg.assistant ul, .msg.assistant ol, .msg.assistant pre, .msg.assistant .code,
  .msg.assistant blockquote, .msg.assistant table { margin: 0 0 12px; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3, .msg.assistant h4 {
    margin: 20px 0 8px;
    line-height: 1.3;
  }
  .msg.assistant h1 { font-size: 1.35em; }
  .msg.assistant h2 { font-size: 1.2em; }
  .msg.assistant h3, .msg.assistant h4 { font-size: 1.05em; }
  .msg.assistant ul, .msg.assistant ol { padding-left: 22px; }
  .msg.assistant li + li { margin-top: 4px; }
  .msg.assistant a { color: var(--accent); }
  .msg.assistant blockquote {
    padding-left: 12px;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  .msg.assistant table { border-collapse: collapse; display: block; overflow-x: auto; }
  .msg.assistant th, .msg.assistant td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .msg.assistant hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
  .msg.assistant code { font-size: 0.88em; padding: 1px 5px; border-radius: 5px; background: var(--code-bg); }
  .msg.assistant .code {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--code-bg);
    overflow: hidden;
  }
  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 4px 6px 4px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
  }
  .msg.assistant .code pre {
    margin: 0;
    padding: 12px 14px;
    overflow-x: auto;
    line-height: 1.5;
  }
  .msg.assistant pre code { padding: 0; background: none; font-size: 13px; }
  .copy {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }
  .copy:hover { background: var(--surface-2); color: var(--text); }
  .copy:focus-visible { outline: 2px solid var(--accent); }

  .hljs-keyword, .hljs-selector-tag, .hljs-doctag { color: var(--hl-keyword); }
  .hljs-string, .hljs-regexp, .hljs-char, .hljs-addition { color: var(--hl-string); }
  .hljs-number, .hljs-literal, .hljs-symbol { color: var(--hl-number); }
  .hljs-comment, .hljs-quote { color: var(--hl-comment); font-style: italic; }
  .hljs-title, .hljs-section, .hljs-selector-id { color: var(--hl-function); }
  .hljs-type, .hljs-title.class_, .hljs-selector-class { color: var(--hl-type); }
  .hljs-built_in, .hljs-deletion { color: var(--hl-builtin); }
  .hljs-meta, .hljs-meta .hljs-keyword { color: var(--hl-meta); }
  .hljs-meta .hljs-string { color: var(--hl-string); }
  .hljs-attr, .hljs-attribute, .hljs-property, .hljs-variable, .hljs-template-variable, .hljs-name { color: var(--hl-attr); }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 650; }

  .pending[hidden] { display: none; }
  .pending .mark { animation: breathe 2.4s ease-in-out infinite; }
  .thinking {
    display: inline-block;
    padding: 8px 0;
    font-size: 14.5px;
    font-weight: 500;
    background: linear-gradient(100deg, var(--muted) 25%, var(--accent) 42%, var(--accent-2) 52%, var(--muted) 68%);
    background-size: 260% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: sweep 2.4s linear infinite;
  }

  .notice {
    align-self: center;
    max-width: min(90%, 420px);
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }

  /* Composer */
  .composer {
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg);
  }
  .composer-inner { position: relative; max-width: 780px; margin: 0 auto; }
  .prompt { position: relative; border-radius: 22px; }
  /* The angle is animated, which a plain custom property cannot do */
  @property --angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }
  .prompt::before, .prompt::after {
    content: "";
    position: absolute;
    inset: -2px;
    z-index: 0;
    border-radius: inherit;
    background: conic-gradient(from var(--angle),
      transparent 0deg 190deg, var(--accent) 280deg, var(--accent-2) 330deg, transparent 360deg);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .prompt::after { inset: -7px; filter: blur(13px); }
  .prompt.busy::before { opacity: 1; animation: turn 2.8s linear infinite; }
  .prompt.busy::after { opacity: 0.55; animation: turn 2.8s linear infinite; }
  .prompt form { position: relative; z-index: 1; }
  .composer form {
    display: block;
    padding: 7px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--surface);
    box-shadow: var(--shadow);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .composer form:focus-within { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 3px var(--accent-soft); }
  .composer.drag form { border-color: var(--accent); border-style: dashed; }
  .row { display: flex; align-items: flex-end; gap: 8px; }
  .attach {
    display: grid;
    place-items: center;
    flex: none;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .attach:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  .attach:disabled { opacity: 0.45; cursor: default; }
  .attach:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Images waiting to be sent */
  .tray { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 4px 8px; }
  .tray[hidden] { display: none; }
  .shot {
    position: relative;
    width: 58px;
    height: 58px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--surface-2);
  }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .shot.uploading img { opacity: 0.4; }
  .shot.failed { border-color: var(--danger); }
  .shot .spin { position: absolute; inset: 0; display: grid; place-items: center; }
  .shot .spin::after {
    content: "";
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .shot .remove {
    position: absolute;
    top: 3px;
    right: 3px;
    display: grid;
    place-items: center;
    width: 18px;
    height: 18px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgb(10 5 20 / 0.6);
    color: #fff;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }
  .shot .remove:hover { background: var(--danger); }

  /* Images inside a sent message */
  .shots { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .shots img {
    display: block;
    width: 128px;
    height: 128px;
    object-fit: cover;
    border: 1px solid rgb(255 255 255 / 0.25);
    border-radius: 10px;
  }
  .shots .gone {
    display: grid;
    place-items: center;
    width: 128px;
    height: 128px;
    padding: 0 10px;
    border: 1px dashed rgb(255 255 255 / 0.35);
    border-radius: 10px;
    font-size: 12px;
    text-align: center;
    opacity: 0.75;
  }
  textarea {
    flex: 1;
    min-height: 24px;
    max-height: 200px;
    margin: 5px 0;
    padding: 0;
    border: 0;
    outline: none;
    resize: none;
    background: transparent;
    color: inherit;
    font: inherit;
  }
  textarea::placeholder { color: var(--muted); }
  textarea:disabled { cursor: not-allowed; }
  .send {
    display: grid;
    place-items: center;
    flex: none;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .send:active:not(:disabled) { transform: scale(0.92); }
  .send:disabled { background: var(--surface-2); color: var(--off); cursor: default; }
  .send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint {
    max-width: 780px;
    margin: 6px auto 0;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
  .hint.error { color: var(--danger); }

  /* Command menu */
  .menu {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(100% + 8px);
    z-index: 10;
    display: flex;
    flex-direction: column;
    max-height: min(340px, 55dvh);
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: pop 0.12s ease-out;
  }
  .menu[hidden] { display: none; }
  .menu-title {
    padding: 10px 14px 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .menu-list { padding: 2px 6px 6px; overflow-y: auto; }
  .item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 9px;
    cursor: pointer;
  }
  .item[aria-selected="true"] { background: var(--accent-soft); }
  .item .cmd { flex: none; font-family: var(--mono); font-weight: 650; color: var(--accent); }
  .item .cmd mark { background: none; color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .item .usage { flex: none; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .item .desc {
    min-width: 0;
    margin-left: auto;
    overflow: hidden;
    color: var(--muted);
    font-size: 13px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item .current {
    margin-left: auto;
    padding: 0 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
  }
  .menu-empty { padding: 10px; color: var(--muted); font-size: 13px; }
  .menu-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    padding: 7px 14px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11.5px;
  }

  @media (max-width: 860px) {
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      width: min(280px, 82vw);
      transform: translateX(-100%);
      transition: transform 0.2s ease-out;
    }
    .sidebar.open { transform: none; box-shadow: var(--shadow-lg); }
    .burger { display: grid; }
  }
  @media (max-width: 560px) {
    .status-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .model-chip { max-width: 170px; }
    .item { flex-wrap: wrap; row-gap: 0; }
    .item .desc { flex-basis: 100%; margin-left: 0; white-space: normal; }
    .extra { display: none; }
  }

  @keyframes pulse { 50% { opacity: 0.35; } }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes breathe {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); }
    50% { transform: scale(1.09); filter: drop-shadow(0 2px 10px var(--halo)); }
  }
  @keyframes sweep { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  @keyframes turn { to { --angle: 360deg; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { opacity: 0; transform: translateY(4px) scale(0.99); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

  </svg>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Sessions">
      <div class="side-head">
        <button class="new-session" id="new-session" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          New session
        </button>
        <button class="icon-btn" id="collapse" type="button" title="Hide the sessions" aria-label="Hide the sessions">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 4v16M7.5 10L6 12l1.5 2"/>
          </svg>
        </button>
      </div>
      <div class="sessions" id="sessions"></div>
      <div class="side-foot">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="who" id="who"></span>
      </div>
    </aside>

    <div class="col">
  <header class="bar">
    <div class="brand">
      <button class="burger" id="burger" type="button" aria-label="Sessions" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
      <svg class="mark" style="width: 34px; height: 34px" aria-hidden="true"><use href="#louis-mark"/></svg>
      <span class="brand-text">
        <span class="brand-name">Louis</span>
        <span class="brand-sub">by KronkAI</span>
      </span>
    </div>
    <div class="bar-end">
      <div class="status" id="status" data-state="connecting" role="status">
        <span class="dot"></span><span class="status-text" id="status-text">Connecting…</span>
      </div>
      <button class="model-chip" id="model-chip" type="button" title="Switch model" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>
        </svg>
        <span class="name" id="model-name"></span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <button class="icon-btn" id="theme" type="button">
        <svg class="on" data-theme="system" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/>
        </svg>
        <svg data-theme="light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg data-theme="dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
        </svg>
        <svg data-theme="ultravision" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
          <circle cx="12" cy="12" r="3.4"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="scroller">
    <div class="log" id="log" aria-live="polite"></div>
  </main>

  <footer class="composer">
    <div class="composer-inner">
      <div class="menu" id="menu" hidden>
        <div class="menu-title" id="menu-title"></div>
        <div class="menu-list" id="menu-list" role="listbox" aria-labelledby="menu-title"></div>
        <div class="menu-foot">
          <span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span>
          <span><kbd>Enter</kbd> select</span>
          <span class="extra"><kbd>Tab</kbd> complete</span>
          <span><kbd>Esc</kbd> close</span>
        </div>
      </div>
      <div class="prompt" id="prompt">
      <form id="form">
        <div class="tray" id="tray" hidden></div>
        <div class="row">
          <button class="attach" id="attach" type="button" aria-label="Attach images" title="Attach images">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.4 11.1l-8.5 8.5a5 5 0 01-7.1-7.1l8.5-8.5a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-2.8-2.8l7.8-7.8"/>
            </svg>
          </button>
          <textarea id="input" rows="1" placeholder="Send a message, or / for commands" aria-label="Message"
            aria-autocomplete="list" aria-controls="menu-list" aria-expanded="false" autofocus></textarea>
          <button class="send" id="send" type="submit" aria-label="Send" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
        </div>
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
      </form>
      </div>
    </div>
    <p class="hint" id="hint"></p>
  </footer>
    </div>
  </div>
  <div class="backdrop" id="backdrop" hidden></div>

  <dialog id="dialog">
    <form method="dialog" id="dialog-form">
      <div class="dialog-body">
        <h2>New session</h2>
        <p>The conversation starts empty. A system prompt tells the model how to behave; leave it empty for none.</p>
        <textarea id="system-prompt" placeholder="You are a helpful assistant that answers in French." aria-label="System prompt"></textarea>
      </div>
      <div class="dialog-foot">
        <button class="btn" type="button" id="dialog-cancel">Cancel</button>
        <button class="btn primary" type="submit">Create session</button>
      </div>
    </form>
  </dialog>

<script>
  const HINT = 'Enter to send · Shift+Enter for a new line<span class="extra"> · ↑ for your last messages</span>';
  const SUGGESTIONS = ["What time is it?", "Explain recursion like I'm five", "Write a haiku about Python"];
  // Commands whose argument is a model name, completed from the models the server has
  const MODEL_COMMANDS = ["model"];
  const MARK = '<svg class="mark" aria-hidden="true"><use href="#louis-mark"/></svg>';
  const IMAGE_TYPES = ["image/png", "image/jpeg", "image/webp", "image/gif"];
  const MAX_IMAGE = 12 * 1024 * 1024;  // Same limit as the server
  const MAX_SHOTS = 6;                 // Images attached to one message
  const THEMES = ["system", "light", "dark", "ultravision"];

  const $ = (id) => document.getElementById(id);
  const scroller = $("scroller"), logEl = $("log"), form = $("form"), input = $("input");
  const send = $("send"), hint = $("hint"), statusEl = $("status"), statusText = $("status-text");
  const modelChip = $("model-chip"), modelName = $("model-name");
  const menuEl = $("menu"), menuTitle = $("menu-title"), menuList = $("menu-list");
  const sidebar = $("sidebar"), sessionsEl = $("sessions"), backdrop = $("backdrop"), burger = $("burger");
  const avatar = $("avatar"), who = $("who"), app = document.querySelector(".app");
  const dialog = $("dialog"), systemPrompt = $("system-prompt"), themeBtn = $("theme"), prompt = $("prompt");
  const attachBtn = $("attach"), fileInput = $("file"), tray = $("tray"), composer = document.querySelector(".composer");

  /* ---------- Theme: system, light or dark, kept for the next visit ---------- */

  let theme = "system";
  try {
    theme = THEMES.includes(localStorage.getItem("louis-theme")) ? localStorage.getItem("louis-theme") : "system";
  } catch {}

  function applyTheme() {
    if (theme === "system") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = theme;
    themeBtn.querySelectorAll("svg").forEach((icon) => icon.classList.toggle("on", icon.dataset.theme === theme));
    const next = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    themeBtn.title = `Theme: ${theme} (switch to ${next})`;
    themeBtn.setAttribute("aria-label", themeBtn.title);
    try { localStorage.setItem("louis-theme", theme); } catch {}
  }

  themeBtn.addEventListener("click", () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    applyTheme();
    if (theme === "ultravision") addNotice("🛸 UltraVision engaged.");
  });
  applyTheme();

  // Same state as the server: rebuilt from its snapshot on every (re)connection
  const state = { log: [], waiting: false, closed: false, info: null, connected: false, sending: false, tool: null };
  let pending = null;          // The thinking line, shown until the answer starts
  let dirty = null;            // assistant entry waiting for a re-render
  let frame = 0;

  /* ---------- Rendering ---------- */

  function markdown(text) {
    if (!window.marked || !window.DOMPurify) return null;
    return DOMPurify.sanitize(marked.parse(text, { breaks: true, gfm: true }));
  }

  function isCommand(text) {
    const info = state.info;
    if (!info) return false;
    const word = text.trim().split(/\s+/)[0];
    return word.startsWith(info.prefix) && !!findCommand(word.slice(info.prefix.length));
  }

  function renderEntry(entry) {
    const body = entry.body;
    const text = entry.text.trim();
    if (entry.role === "user") {
      body.textContent = text;
      entry.el.classList.toggle("command", isCommand(text));
      if (entry.images?.length) body.prepend(shotsBox(entry.images));
      return;
    }
    entry.el.hidden = !text && !entry.tools?.length;  // The CLI's blank lines around answers
    const html = markdown(text);
    entry.el.classList.toggle("plain", html === null);
    if (html === null) body.textContent = text;
    else {
      body.innerHTML = html;
      body.querySelectorAll("pre").forEach(decorateCode);
    }
    if (entry.tools?.length) body.prepend(toolsBox(entry.tools));
  }

  // Highlight a code block when its language is given (```py, ```c, ...), and add its header
  function decorateCode(pre) {
    const code = pre.querySelector("code");
    const lang = code?.className.match(/language-(\S+)/)?.[1];
    const known = lang && window.hljs?.getLanguage(lang);
    if (known) hljs.highlightElement(code);

    const box = document.createElement("div");
    box.className = "code";
    const head = document.createElement("div");
    head.className = "code-head";
    const label = document.createElement("span");
    label.textContent = known?.name ?? lang ?? "";
    const button = document.createElement("button");
    button.type = "button";
    button.className = "copy";
    button.textContent = "Copy";
    button.addEventListener("click", () => copy(code?.textContent ?? pre.textContent, button));
    head.append(label, button);
    pre.replaceWith(box);
    box.append(head, pre);
  }

  function toolsBox(tools) {
    const box = document.createElement("details");
    box.className = "tools";
    const summary = document.createElement("summary");
    summary.innerHTML = `
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a4 4 0 01-5 5L4 17v3h3l5.7-5.7a4 4 0 005-5l-2.6 2.6-2.3-.7-.7-2.3z"/>
      </svg>
      <span>${tools.length} tool${tools.length === 1 ? "" : "s"} used</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 9l6 6 6-6"/>
      </svg>`;
    const list = document.createElement("div");
    list.className = "tools-list";
    for (const tool of tools) {
      const row = document.createElement("div");
      row.className = "tool";
      row.append(Object.assign(document.createElement("span"), { className: "name", textContent: tool.name }));
      if (tool.detail) {
        row.append(Object.assign(document.createElement("span"), { className: "detail", textContent: tool.detail }));
      }
      list.append(row);
    }
    box.append(summary, list);
    return box;
  }

  function addEntry(entry) {
    entry.el = document.createElement("div");
    entry.el.className = `msg ${entry.role}`;
    if (entry.role === "assistant") {
      entry.el.innerHTML = MARK;
      entry.body = document.createElement("div");
      entry.body.className = "body";
      entry.el.append(entry.body);
    } else {
      entry.body = entry.el;
    }
    renderEntry(entry);
    logEl.insertBefore(entry.el, pending);
  }

  function emptyState() {
    const box = document.createElement("div");
    box.className = "empty";
    box.innerHTML = MARK;
    const greeting = document.createElement("h1");
    greeting.className = "greeting";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = state.info?.user ?? "";
    greeting.append(name.textContent ? "Bonjour, " : "Bonjour", name, ".");
    const lead = document.createElement("p");
    lead.className = "lead";
    lead.textContent = "How can I help you today?";
    const suggestions = document.createElement("div");
    suggestions.className = "suggestions";
    for (const text of SUGGESTIONS) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "suggestion";
      button.textContent = text;
      button.addEventListener("click", () => { input.value = text; submit(); });
      suggestions.append(button);
    }
    const tip = document.createElement("p");
    tip.className = "tip";
    tip.innerHTML = `Type <kbd>${escapeHtml(state.info?.prefix ?? "/")}</kbd> to see the commands`;
    box.append(greeting, lead, suggestions, tip);
    return box;
  }

  function renderAll() {
    logEl.replaceChildren();
    if (!state.log.length && !state.closed) logEl.append(emptyState());
    pending = document.createElement("div");
    pending.className = "msg assistant pending";
    pending.setAttribute("aria-label", "Louis is thinking");
    pending.innerHTML = `${MARK}<div class="body"><span class="thinking">Thinking…</span></div>`;
    logEl.append(pending);
    state.log.forEach((entry) => (entry.role === "system" ? addSystemEntry(entry) : addEntry(entry)));
    if (state.closed) addNotice();
    renderInfo();
    update();
    scrollDown(true);
  }

  function renderInfo() {
    const info = state.info;
    modelChip.hidden = !info;
    if (!info) return;
    modelName.textContent = info.model;
    const empty = logEl.querySelector(".empty");
    if (empty && empty.querySelector(".name").textContent !== info.user) {
      empty.replaceWith(emptyState());
    }
    logEl.querySelectorAll(".msg.user").forEach((el) => el.classList.toggle("command", isCommand(el.textContent)));
    renderSessions();
    if (!menuEl.hidden) refreshMenu(false);
  }

  // SQLite stores UTC: "2026-09-23 08:12:45"
  function parseDate(date) {
    const at = new Date(`${date.replace(" ", "T")}Z`);
    return Number.isNaN(at.getTime()) ? null : at;
  }

  function when(date) {
    const at = parseDate(date);
    if (!at) return date;
    return at.toLocaleString([], { hour: "2-digit", minute: "2-digit" });
  }

  function day(date) {
    const at = parseDate(date);
    if (!at) return "Earlier";
    const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(at).setHours(0, 0, 0, 0)) / 86400000);
    if (days <= 0) return "Today";
    if (days === 1) return "Yesterday";
    if (days < 7) return "This week";
    return at.toLocaleDateString([], { month: "long", year: at.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
  }

  function renderSessions() {
    const info = state.info;
    sessionsEl.replaceChildren();
    avatar.textContent = (info?.user ?? "?").trim()[0].toUpperCase();
    who.textContent = info?.user ?? "";
    if (!info) return;
    if (info.anonymous) {
      const note = document.createElement("p");
      note.className = "side-note";
      note.textContent = "Nothing is saved for Anonymous. Start the app with --user <name> to keep your sessions.";
      sessionsEl.append(note);
      return;
    }
    let group = null;
    for (const session of info.sessions) {
      const label = day(session.updated_at);  // Sessions are now ordered by activity, not creation
      if (label !== group) {
        group = label;
        sessionsEl.append(Object.assign(document.createElement("div"), { className: "group-title", textContent: label }));
      }
      const button = document.createElement("button");
      button.type = "button";
      button.className = "session";
      button.setAttribute("aria-current", String(session.id === info.session));
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = session.preview?.trim().split("\n")[0] || "Empty session";
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = `${when(session.updated_at)} · ${session.messages} message${session.messages === 1 ? "" : "s"}`;
      button.append(title, meta);
      button.addEventListener("click", () => openSession(session.id));
      sessionsEl.append(button);
    }
  }

  function openSession(id) {
    closeDrawer();
    if (id === state.info.session) return;  // Already open
    post(`${state.info.prefix}session ${id}`);
  }

  /* ---------- Sidebar and new session ---------- */

  function openDrawer() {
    sidebar.classList.add("open");
    backdrop.hidden = false;
    burger.setAttribute("aria-expanded", "true");
  }

  function closeDrawer() {
    sidebar.classList.remove("open");
    backdrop.hidden = true;
    burger.setAttribute("aria-expanded", "false");
  }

  // Narrow screens: the sidebar is a drawer. Wide ones: it folds away.
  const narrow = () => window.matchMedia("(max-width: 860px)").matches;
  let collapsed = false;
  try { collapsed = localStorage.getItem("louis-sidebar") === "collapsed"; } catch {}

  function applySidebar() {
    app.classList.toggle("collapsed", collapsed);
    burger.title = collapsed ? "Show the sessions" : "Hide the sessions";
    burger.setAttribute("aria-label", burger.title);
    try { localStorage.setItem("louis-sidebar", collapsed ? "collapsed" : "open"); } catch {}
  }

  $("collapse").addEventListener("click", () => {
    if (narrow()) closeDrawer();
    else {
      collapsed = true;
      applySidebar();
    }
  });

  burger.addEventListener("click", () => {
    if (narrow()) {
      sidebar.classList.contains("open") ? closeDrawer() : openDrawer();
      return;
    }
    collapsed = !collapsed;
    applySidebar();
  });
  applySidebar();
  backdrop.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

  $("new-session").addEventListener("click", () => {
    systemPrompt.value = "";
    dialog.showModal();
  });
  $("dialog-cancel").addEventListener("click", () => dialog.close());
  $("dialog-form").addEventListener("submit", () => {
    // A command is how a session is created: the manager handles it like a typed one
    const prompt = systemPrompt.value.trim();
    closeDrawer();
    post(`${state.info.prefix}new-session${prompt ? ` ${prompt}` : ""}`);
  });

  function addNotice(text = "Session ended") {
    const el = document.createElement("div");
    el.className = "notice";
    el.textContent = text;
    logEl.append(el);
  }

  // Kept in state.log so it survives a reconnect, at the point in the conversation it happened
  function addSystemEntry(entry) {
    entry.el = document.createElement("div");
    entry.el.className = "notice";
    entry.el.textContent = entry.text;
    logEl.insertBefore(entry.el, pending);
  }

  function removeEmptyState() {
    logEl.querySelector(".empty")?.remove();
  }

  let stick = true;
  scroller.addEventListener("scroll", () => {
    stick = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
  });

  function scrollDown(force) {
    if (force || stick) scroller.scrollTop = scroller.scrollHeight;
  }

  function update() {
    const busy = state.connected && !state.waiting && !state.closed;
    const last = state.log[state.log.length - 1];
    pending.hidden = !busy || !last || (last.role === "assistant" && last.text.trim() !== "");
    prompt.classList.toggle("busy", busy);

    let label, key;
    if (state.closed) [key, label] = ["closed", state.connected ? "Session ended" : "Server stopped"];
    else if (!state.connected) [key, label] = ["reconnecting", "Reconnecting…"];
    else if (state.waiting) [key, label] = ["ready", "Ready"];
    else [key, label] = ["busy", "Thinking…"];
    statusEl.dataset.state = key;
    statusEl.title = label;
    statusText.textContent = label;

    // The inline "thinking" line names the tool actually running, when one is
    const thinking = pending.querySelector(".thinking");
    if (thinking) {
      thinking.textContent = state.tool
        ? `Using ${state.tool.name}${state.tool.detail ? ` · ${state.tool.detail}` : ""}…`
        : "Gamberging…";
    }

    input.disabled = state.closed;
    const blind = state.info?.vision === false;  // null while the model says nothing
    attachBtn.disabled = state.closed || blind;
    attachBtn.title = blind ? `${state.info.model} cannot read images` : "Attach images";
    send.disabled = !canSend() || !input.value.trim();
    modelChip.disabled = state.closed;
    logEl.querySelectorAll(".suggestion").forEach((button) => { button.disabled = !canSend(); });
    document.querySelectorAll(".session, .new-session").forEach((button) => {
      button.disabled = !canSend();
      button.title = canSend() ? "" : "Wait for the answer";
    });
    if (state.closed) {
      input.placeholder = "This session has ended";
      closeMenu();
    }
    hint.hidden = state.closed;
  }

  function canSend() {
    return state.connected && state.waiting && !state.closed && !state.sending;
  }

  function flush() {
    frame = 0;
    if (dirty) renderEntry(dirty);
    dirty = null;
    update();
    scrollDown();
  }

  /* ---------- Events from the server ---------- */

  function handle(event) {
    switch (event.type) {
      case "snapshot":
        Object.assign(state, {
          log: event.log, waiting: event.waiting, closed: event.closed, info: event.info, tool: null
        });
        dirty = null;
        renderAll();
        return;
      case "info":
        state.info = event.info;
        renderInfo();
        break;
      case "reset":
        state.log = event.log;
        state.tool = null;
        dirty = null;
        renderAll();
        return;
      case "waiting":
        state.waiting = true;
        state.tool = null;  // Whatever ran during the last turn is over
        break;
      case "tools": {
        // They served the answer that was just shown
        const last = state.log[state.log.length - 1];
        if (last && last.role === "assistant") {
          last.tools = event.tools;
          dirty = last;
        }
        break;
      }
      case "input": {
        state.waiting = false;
        const entry = { role: "user", text: event.text, images: event.images };
        state.log.push(entry);
        addEntry(entry);
        removeEmptyState();
        stick = true;
        break;
      }
      case "output": {
        let last = state.log[state.log.length - 1];
        if (!last || last.role !== "assistant") {
          last = { role: "assistant", text: "" };
          state.log.push(last);
          addEntry(last);
          removeEmptyState();
        }
        last.text += event.text;
        dirty = last;
        break;
      }
      case "closed":
        state.waiting = false;
        state.closed = true;
        addNotice();
        break;
      case "system": {
        // A backend event turned into a plain-language line, not an answer from Louis
        const entry = { role: "system", text: event.text };
        state.log.push(entry);
        addSystemEntry(entry);
        removeEmptyState();
        break;
      }
      case "tool_start":
        // Live only, not part of the log: the "N tools used" summary is the lasting record
        state.tool = { name: event.name, detail: event.detail };
        break;
      case "tool_end":
        if (state.tool?.name === event.name) state.tool = null;
        break;
    }
    if (!frame) frame = requestAnimationFrame(flush);
  }

  // Server-Sent Events: reconnects by itself, the snapshot then replaces everything shown
  const source = new EventSource("/api/events");
  source.onopen = () => { state.connected = true; update(); };
  source.onmessage = (e) => handle(JSON.parse(e.data));
  source.onerror = () => {
    state.connected = false;
    if (state.closed) source.close();  // The server stopped for good
    update();
  };

  /* ---------- Sending ---------- */

  async function post(text, images = []) {
    if (!text.trim() || !canSend()) return false;
    state.sending = true;
    closeMenu();
    update();
    let sent = false;
    try {
      const res = await fetch("/api/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, images }),
      });
      if (!res.ok) throw new Error(res.status === 409 ? "The session has ended" : `Error ${res.status}`);
      state.waiting = false;  // Until the server says otherwise, avoids sending twice
      sent = true;
      setHint(HINT);
    } catch (err) {
      setHint(err instanceof TypeError ? "Cannot reach the server" : err.message, true);
    } finally {
      state.sending = false;
      update();
    }
    return sent;
  }

  async function submit() {
    if (!input.value.trim() || !canSend()) return;
    if (shots.length) {
      state.sending = true;  // Keep it from being sent twice while the images go up
      update();
      await Promise.allSettled(shots.map((shot) => shot.done));
      state.sending = false;
      if (shots.some((shot) => shot.status === "failed")) {
        setHint("Remove the images that failed, or try again", true);
        update();
        return;
      }
    }
    if (!(await post(input.value, shots.map((shot) => shot.id)))) return;
    clearShots();
    input.value = "";
    recallPos = null;
    resize();
    update();
  }

  function setHint(text, error = false) {
    if (error) hint.textContent = text;
    else hint.innerHTML = text;
    hint.classList.toggle("error", error);
  }

  function resize() {
    input.style.height = "auto";
    input.style.height = `${input.scrollHeight}px`;
  }

  async function copy(text, button) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        // Plain http from another computer: no Clipboard API
        const area = Object.assign(document.createElement("textarea"), { value: text });
        area.style.cssText = "position:fixed;opacity:0";
        document.body.append(area);
        area.select();
        const ok = document.execCommand("copy");
        area.remove();
        if (!ok) throw new Error();
      }
      button.textContent = "Copied";
    } catch {
      button.textContent = "Failed";
    }
    setTimeout(() => { button.textContent = "Copy"; }, 1500);
  }

  /* ---------- Images to send ---------- */

  let shots = [];  // { file, url, id, status: uploading | ready | failed }

  function addFiles(files) {
    for (const file of files) {
      if (!IMAGE_TYPES.includes(file.type)) {
        setHint(`${file.name || "That file"} is not an image Louis can read`, true);
        continue;
      }
      if (file.size > MAX_IMAGE) {
        setHint(`${file.name} is too large (${Math.round(file.size / 1e6)} MB, 12 MB max)`, true);
        continue;
      }
      if (shots.length >= MAX_SHOTS) {
        setHint(`${MAX_SHOTS} images per message at most`, true);
        break;
      }
      const shot = { file, url: URL.createObjectURL(file), id: null, status: "uploading" };
      shot.done = upload(shot);
      shots.push(shot);
    }
    renderTray();
    update();
  }

  // Uploaded as soon as they are picked, so sending is instant
  async function upload(shot) {
    try {
      const res = await fetch("/api/images", {
        method: "POST",
        headers: { "Content-Type": shot.file.type },
        body: shot.file,
      });
      if (!res.ok) throw new Error(`Error ${res.status}`);
      shot.id = (await res.json()).id;
      shot.status = "ready";
    } catch {
      shot.status = "failed";
      setHint(`${shot.file.name} could not be uploaded`, true);
    }
    renderTray();
    update();
  }

  function removeShot(shot) {
    URL.revokeObjectURL(shot.url);
    shots = shots.filter((other) => other !== shot);
    renderTray();
    update();
  }

  function clearShots() {
    shots.forEach((shot) => URL.revokeObjectURL(shot.url));
    shots = [];
    renderTray();
  }

  function renderTray() {
    tray.replaceChildren();
    tray.hidden = !shots.length;
    for (const shot of shots) {
      const box = document.createElement("div");
      box.className = `shot ${shot.status}`;
      box.title = shot.file.name;
      box.append(Object.assign(document.createElement("img"), { src: shot.url, alt: shot.file.name }));
      if (shot.status === "uploading") {
        box.append(Object.assign(document.createElement("span"), { className: "spin" }));
      }
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "remove";
      remove.textContent = "×";
      remove.setAttribute("aria-label", `Remove ${shot.file.name}`);
      remove.addEventListener("click", () => removeShot(shot));
      box.append(remove);
      tray.append(box);
    }
  }

  function shotsBox(ids) {
    const box = document.createElement("div");
    box.className = "shots";
    for (const id of ids) {
      const link = document.createElement("a");
      link.href = `/api/images/${id}`;
      link.target = "_blank";
      link.rel = "noopener";
      const img = Object.assign(document.createElement("img"), { src: `/api/images/${id}`, alt: "Attached image" });
      // The server only keeps the last images in memory
      img.addEventListener("error", () => link.replaceWith(
        Object.assign(document.createElement("span"), { className: "gone", textContent: "Image no longer kept" })
      ));
      link.append(img);
      box.append(link);
    }
    return box;
  }

  attachBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    addFiles(fileInput.files);
    fileInput.value = "";  // The same file can be picked again
  });
  input.addEventListener("paste", (e) => {
    const files = [...(e.clipboardData?.files ?? [])].filter((file) => IMAGE_TYPES.includes(file.type));
    if (!files.length) return;
    e.preventDefault();
    addFiles(files);
  });
  for (const name of ["dragenter", "dragover"]) {
    document.addEventListener(name, (e) => {
      if (![...e.dataTransfer.types].includes("Files")) return;
      e.preventDefault();
      composer.classList.add("drag");
    });
  }
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) composer.classList.remove("drag"); });
  document.addEventListener("drop", (e) => {
    if (!e.dataTransfer.files.length) return;
    e.preventDefault();
    composer.classList.remove("drag");
    if (!state.closed) addFiles(e.dataTransfer.files);
  });

  /* ---------- Previous messages (↑ / ↓) ---------- */

  let recallPos = null;  // Index of the recalled message among the sent ones

  function recall(step) {
    const sent = state.log.filter((entry) => entry.role === "user").map((entry) => entry.text);
    const recalling = recallPos !== null && input.value === sent[recallPos];
    if (!recalling && input.value) return false;  // Never replace a draft
    if (input.value.includes("\n")) return false; // Let the arrows move in multi-line text
    const pos = recalling ? recallPos + step : step < 0 ? sent.length - 1 : null;
    if (pos === null || pos < 0) return recalling;
    if (pos >= sent.length) {
      recallPos = null;
      input.value = "";
    } else {
      recallPos = pos;
      input.value = sent[pos];
    }
    resize();
    update();
    return true;
  }

  /* ---------- Command menu ---------- */

  const menu = { mode: null, items: [], active: 0, dismissed: null };
  let models = null;  // null: to load, "loading", "error", or the names

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  }

  function escapeRegex(text) {
    return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function findCommand(word) {
    return state.info?.commands.find((cmd) => cmd.name === word || cmd.alias.includes(word));
  }

  function menuContext() {
    const info = state.info;
    if (!info || state.closed) return null;
    const prefix = escapeRegex(info.prefix);
    let match = input.value.match(new RegExp(`^${prefix}(\\S*)$`));
    if (match) return { mode: "commands", query: match[1].toLowerCase() };
    match = input.value.match(new RegExp(`^${prefix}(\\S+)\\s+(\\S*)$`));
    const command = match && findCommand(match[1]);
    if (command && MODEL_COMMANDS.includes(command.name)) {
      return { mode: "models", command: match[1], query: match[2].toLowerCase() };
    }
    return null;
  }

  function menuItems(context) {
    const prefix = state.info.prefix;
    if (context.mode === "commands") {
      return state.info.commands
        .filter((cmd) => [cmd.name, ...cmd.alias].some((word) => word.startsWith(context.query)))
        .map((cmd) => ({
          label: cmd.name,
          usage: cmd.usage,
          description: cmd.description,
          value: `${prefix}${cmd.name}${cmd.usage ? " " : ""}`,
          final: !cmd.usage,  // Nothing more to type: selecting it sends it
        }));
    }
    if (!Array.isArray(models)) return [];
    return models
      .filter((name) => name.toLowerCase().includes(context.query))
      .map((name) => ({
        label: name,
        current: name === state.info.model,
        value: `${prefix}${context.command} ${name}`,
        final: true,
      }));
  }

  async function loadModels() {
    if (!Array.isArray(models)) models = "loading";  // Otherwise show the last list meanwhile
    try {
      const res = await fetch("/api/models");
      if (!res.ok) throw new Error();
      models = (await res.json()).models;
    } catch {
      models = "error";
    }
    if (menu.mode === "models") refreshMenu(false);
  }

  function refreshMenu(resetActive = true) {
    const context = menuContext();
    if (!context || menu.dismissed === input.value) return closeMenu();
    // Reload the models each time their menu opens: some may have been pulled meanwhile
    if (context.mode === "models" && menu.mode !== "models") loadModels();
    menu.mode = context.mode;
    menu.items = menuItems(context);
    if (resetActive || menu.active >= menu.items.length) menu.active = 0;
    renderMenu(context);
  }

  function renderMenu(context) {
    const prefix = state.info.prefix;
    menuTitle.textContent = context.mode === "commands" ? "Commands" : "Models";
    menuList.replaceChildren();
    if (!menu.items.length) {
      const empty = document.createElement("div");
      empty.className = "menu-empty";
      if (context.mode === "commands") empty.textContent = "No command matches: it will be sent as a message";
      else if (models === "loading" || models === null) empty.textContent = "Loading models…";
      else if (models === "error") empty.textContent = "Cannot list the models";
      else empty.textContent = "No model matches";
      menuList.append(empty);
    }
    menu.items.forEach((item, i) => {
      const el = document.createElement("div");
      el.className = "item";
      el.id = `menu-item-${i}`;
      el.setAttribute("role", "option");
      el.setAttribute("aria-selected", String(i === menu.active));
      const name = document.createElement("span");
      name.className = "cmd";
      if (context.mode === "commands") {
        // Underline what was typed
        const typed = item.label.startsWith(context.query) ? context.query.length : 0;
        const mark = document.createElement("mark");
        mark.textContent = item.label.slice(0, typed);
        name.append(prefix, mark, item.label.slice(typed));
      } else {
        name.textContent = item.label;
      }
      el.append(name);
      if (item.usage) el.append(Object.assign(document.createElement("span"), { className: "usage", textContent: item.usage }));
      if (item.description) el.append(Object.assign(document.createElement("span"), { className: "desc", textContent: item.description }));
      if (item.current) el.append(Object.assign(document.createElement("span"), { className: "current", textContent: "current" }));
      el.addEventListener("mousemove", () => { if (menu.active !== i) setActive(i); });
      el.addEventListener("click", () => choose(item));
      menuList.append(el);
    });
    menuEl.hidden = false;
    input.setAttribute("aria-expanded", "true");
    setActive(menu.active);
  }

  function setActive(i) {
    menu.active = i;
    menuList.querySelectorAll(".item").forEach((el, j) => el.setAttribute("aria-selected", String(j === i)));
    const el = $(`menu-item-${i}`);
    if (el) {
      el.scrollIntoView({ block: "nearest" });
      input.setAttribute("aria-activedescendant", el.id);
    } else {
      input.removeAttribute("aria-activedescendant");
    }
  }

  function closeMenu() {
    menu.mode = null;
    menuEl.hidden = true;
    input.setAttribute("aria-expanded", "false");
    input.removeAttribute("aria-activedescendant");
  }

  // Enter / click: send what needs nothing more, otherwise complete it. Tab: always complete.
  function choose(item, completeOnly = false) {
    input.value = item.value;
    input.focus();
    resize();
    if (item.final && !completeOnly && canSend()) {
      submit();
      return;
    }
    refreshMenu();  // May open the menu of its argument
    update();
  }

  menuEl.addEventListener("mousedown", (e) => e.preventDefault());  // Keep the focus in the input

  modelChip.addEventListener("click", () => {
    if (!state.info || state.closed) return;
    input.value = `${state.info.prefix}${MODEL_COMMANDS[0]} `;
    menu.dismissed = null;
    input.focus();
    resize();
    refreshMenu();
    update();
  });

  /* ---------- Input ---------- */

  form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  input.addEventListener("input", () => {
    menu.dismissed = null;
    resize();
    refreshMenu();
    update();
  });
  input.addEventListener("blur", () => closeMenu());
  input.addEventListener("focus", () => refreshMenu());
  input.addEventListener("keydown", (e) => {
    if (e.isComposing) return;
    if (!menuEl.hidden) {
      const count = menu.items.length;
      if ((e.key === "ArrowDown" || e.key === "ArrowUp") && count) {
        e.preventDefault();
        setActive((menu.active + (e.key === "ArrowDown" ? 1 : -1) + count) % count);
        return;
      }
      if (e.key === "Tab" && count) {
        e.preventDefault();
        choose(menu.items[menu.active], true);
        return;
      }
      if (e.key === "Enter" && !e.shiftKey && count) {
        e.preventDefault();
        choose(menu.items[menu.active]);
        return;
      }
      if (e.key === "Escape") {
        e.preventDefault();
        menu.dismissed = input.value;
        closeMenu();
        return;
      }
    } else if ((e.key === "ArrowUp" || e.key === "ArrowDown") && recall(e.key === "ArrowUp" ? -1 : 1)) {
      e.preventDefault();
      return;
    }
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  // The markdown libraries load after this script: re-render what came in meanwhile
  document.addEventListener("DOMContentLoaded", () => {
    state.log.forEach((entry) => entry.el && renderEntry(entry));
  });

  setHint(HINT);
  renderAll();
</script>
</body>
</html>
